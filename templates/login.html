{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="bg-gray-800 p-10 rounded-3xl shadow-2xl border border-gray-700 backdrop-blur-md">
        <div class="mb-8 text-center">
            <h2 class="text-3xl font-black text-white tracking-tighter mb-2">Welcome Back</h2>
            <p class="text-sm text-gray-400 font-medium">Access your intelligent monitoring dashboard</p>
        </div>
        
        <form method="POST" action="/login" class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2 ml-1" for="email">Email Address</label>
                <input
                    class="w-full px-4 py-3 bg-gray-900/50 border border-gray-700 text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all placeholder-gray-600"
                    type="email" name="email" placeholder="name@example.com" required>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2 ml-1" for="password">Security Password</label>
                <input
                    class="w-full px-4 py-3 bg-gray-900/50 border border-gray-700 text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all placeholder-gray-600"
                    type="password" name="password" placeholder="••••••••" required>
            </div>
            
            <button
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-lg shadow-blue-900/30 active:scale-[0.98]"
                type="submit">
                Authorize Access
            </button>
        </form>
        
        <div class="mt-8 pt-6 border-t border-gray-700/50 text-center">
            <p class="text-sm text-gray-400 font-medium">
                New to the platform? <a href="{{ url_for('register') }}" class="text-blue-500 hover:text-blue-400 font-bold transition-colors">Create AI Account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
